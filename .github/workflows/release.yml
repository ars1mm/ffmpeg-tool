name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest
    
    - name: Check Python syntax
      run: |
        Write-Host "Checking Python syntax..."
        python -m py_compile main.py
        Get-ChildItem -Path "video_converter" -Filter "*.py" -Recurse | ForEach-Object {
          Write-Host "Checking $($_.FullName)..."
          python -m py_compile $_.FullName
        }
        Write-Host "[OK] All Python files compile successfully"
    
    - name: Test imports
      run: |
        Write-Host "Testing module imports..."
        python -c "from video_converter import app, converter, ffmpeg, presets, version, update_checker; print('[OK] All modules import successfully')"
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Verify entry point structure
      run: |
        Write-Host "Verifying main.py structure..."
        # Just check it compiles and imports resolve, don't run the GUI
        python -c "import sys; sys.argv = ['main.py']; exec(open('main.py').read(), {'__name__': '__verify__'}); print('[OK] main.py is valid')"
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Download FFmpeg
      run: |
        # Download FFmpeg essentials build
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
        
        # Create bin directory and copy binaries
        New-Item -ItemType Directory -Path "bin" -Force
        $ffmpegDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
        Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination "bin\"
        Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination "bin\"
    
    - name: Build executable
      run: |
        .\build_exe.ps1
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress
    
    - name: Build installer
      run: |
        # Standard Inno Setup installation path
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $isccPath)) {
          Write-Host "Trying alternate path..."
          $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
        }
        if (-not (Test-Path $isccPath)) {
          throw "ISCC.exe not found at expected paths"
        }
        Write-Host "Using ISCC at: $isccPath"
        
        # Compile installer
        & $isccPath "installer.iss"
        if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
    
    - name: Get version from tag
      id: get_version
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "version=$version" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: FFmpeg Video Converter ${{ github.ref_name }}
        body: |
          ## FFmpeg Video Converter ${{ github.ref_name }}
          
          ### Installation
          Download and run `FFmpegConverter-Setup.exe` to install the application.
          
          ### What's New
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          
          ### Requirements
          - Windows 10 or later
          - No additional software required (FFmpeg is bundled)
          
          ### Notes
          - Hardware acceleration (GPU encoding) is automatically detected
          - First launch may trigger Windows SmartScreen (click "More info" → "Run anyway")
        draft: false
        prerelease: false
        files: |
          ./installer_output/FFmpegConverter-Setup.exe
          ./dist/FFmpegConverter.zip
